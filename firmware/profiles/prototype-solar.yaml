# Prototype Solar Node — ROUTER profile (enhanced telemetry)
# Hanging solar relay prototype. Maximum diagnostic telemetry for testing.
# No GPS. All sensor types enabled to probe available hardware.
# NOTE: Not for production — use relay.yaml for deployed nodes.
#
# Apply via: ./firmware/provision.sh "Node Name"

config:
  lora:
    modem_preset: LONG_FAST
    region: US
    tx_power: 30
    hop_limit: 3
    channel_num: 0

  device:
    role: ROUTER
    serial_enabled: true              # Must stay true — only way to reprovision (see LEARNINGS.md)
    # rebroadcast_mode: firmware forces CORE_PORTNUMS_ONLY for ROUTER role
    # node_info_broadcast_secs: firmware resets via initConfigIntervals() for ROUTER role

  position:
    position_broadcast_smart_enabled: false
    gps_enabled: false
    position_broadcast_secs: 3600

  telemetry:
    # device_update_interval: firmware resets to default for ROUTER role
    device_telemetry_enabled: true
    # environment_update_interval: firmware resets via initModuleConfigIntervals() for ROUTER role
    environment_measurement_enabled: true
    # power_update_interval: firmware resets via initModuleConfigIntervals() for ROUTER role
    power_measurement_enabled: true

  power:
    is_power_saving: false

  display:
    auto_screen_carousel_secs: 0
