# Vehicle Node — CLIENT profile
# Mobile node mounted in a vehicle. Reports GPS position while moving.
# Charges via USB when car is on, runs on battery when parked.
# NOTE: ROUTER_CLIENT crashes firmware 2.7.15 on this RAK4631 unit (VHC01).
#       Using CLIENT with rebroadcast_mode: ALL as workaround.
#
# Apply via: ./firmware/provision.sh "Node Name"

config:
  lora:
    modem_preset: LONG_FAST
    region: US
    tx_power: 30
    hop_limit: 3
    channel_num: 0

  device:
    role: CLIENT
    serial_enabled: true              # Must stay true — only way to reprovision (see LEARNINGS.md)
    rebroadcast_mode: ALL
    node_info_broadcast_secs: 900            # 15 min — frequent enough for diagnostics

  position:
    position_broadcast_smart_enabled: true
    broadcast_smart_minimum_interval_secs: 30  # Floor at 30s when moving during testing
    gps_enabled: true
    gps_update_interval: 15
    position_broadcast_secs: 60             # 1 min timer — high frequency during testing

  telemetry:
    device_update_interval: 60              # 1 min — max diagnostics during testing
    device_telemetry_enabled: true

  power:
    is_power_saving: false

  bluetooth:
    enabled: true
    mode: FIXED_PIN

  display:
    auto_screen_carousel_secs: 0
