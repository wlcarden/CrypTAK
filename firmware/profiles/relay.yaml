# Mesh Relay — ROUTER profile
# Deployable relay node. Assumed solar-powered for CrypTAK deployments.
# Rebroadcasts all mesh traffic. GPS position broadcast on a fixed timer
# (smart positioning disabled — relay positions are static in the field).
# For boards without GPS (e.g. RAK19007), set gps: false in nodes.yaml
# and provision.sh will apply a fixed coordinate instead.
#
# Apply via: ./firmware/provision.sh "Node Name"

config:
  lora:
    modem_preset: LONG_FAST
    region: US
    tx_power: 30
    hop_limit: 3
    channel_num: 0

  device:
    role: ROUTER
    serial_enabled: true              # Must stay true — only way to reprovision T-Beam S3 Core boards
    # rebroadcast_mode: firmware forces CORE_PORTNUMS_ONLY for ROUTER role
    # node_info_broadcast_secs: firmware resets via initConfigIntervals() for ROUTER role

  position:
    position_broadcast_smart_enabled: false  # Relays are fixed; smart = never broadcasts
    gps_enabled: true
    gps_update_interval: 60
    position_broadcast_secs: 300             # 5 min — high frequency during testing

  telemetry:
    # device_update_interval: firmware resets to default_telemetry_broadcast_interval_secs for ROUTER role
    device_telemetry_enabled: true

  neighbor_info:
    enabled: true
    update_interval: 900                 # 15 min — relay is solar, balance airtime vs topology freshness

  power:
    is_power_saving: false

  display:
    auto_screen_carousel_secs: 0

  bluetooth:
    enabled: false                 # Relay nodes are unattended — BT is an attack surface
                                   # Field config via: remote admin (cryptak PSK) or serial retrieval
