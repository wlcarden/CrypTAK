name: Deploy Server Stack

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'firmware/nodes.yaml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DEPLOY_DIR: /mnt/user/appdata/tak-server
  NODERED_URL: http://host.docker.internal:1880
  HMDM_URL: http://100.64.0.1:8095
  # Opt into Node.js 24 for actions/* JS actions. GitHub forces this on
  # 2026-06-16; setting it explicitly avoids the deprecation warning and
  # gives us control over when we cut over (today, not at the deadline).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4

      - name: Sync server files to deploy directory
        run: |
          # --inplace: several deployed files are bind-mounted into running
          # containers (fts-patches/, nodered/webmap/index.html, nodered/lib/);
          # rewriting the existing inode keeps those mounts valid instead of
          # leaving them on a replaced file (ESTALE on Unraid shfs).
          rsync -av --inplace \
            --exclude='.env' \
            --exclude='config.local.yaml' \
            --exclude='docker-compose.override.yml' \
            --exclude='authelia/configuration.yml' \
            --exclude='authelia/users_database.yml' \
            --exclude='headscale/config.yaml' \
            --exclude='incident-tracker/config.yaml' \
            server/ "$DEPLOY_DIR/"
          # firmware/nodes.yaml is the node registry (single source of truth,
          # provision.sh and both Node-RED and mesh-relay mount it) but lives
          # outside server/; it was a stale hand copy on the server until
          # 2026-10-01. mesh-relay re-reads it on mtime change.
          mkdir -p "$DEPLOY_DIR/firmware"
          rsync -a --inplace firmware/nodes.yaml "$DEPLOY_DIR/firmware/nodes.yaml"

      - name: Build local images
        working-directory: /mnt/user/appdata/tak-server
        run: |
          # Services with build: directives need explicit rebuild —
          # docker compose pull skips them (no remote image) and up -d
          # reuses the stale local image if the digest hasn't changed.
          docker compose --profile incident-tracker --profile mesh-relay build

      - name: Deploy server stack
        working-directory: /mnt/user/appdata/tak-server
        run: |
          # Exclude github-runner from deploy — recreating the runner's own
          # container mid-job kills the Actions process and cancels the run.
          # Update the runner manually on the server if its config changes.
          SERVICES=$(docker compose config --services | grep -v github-runner)
          docker compose pull $SERVICES
          docker compose up -d --remove-orphans $SERVICES
          # Profile services need explicit targeting — bare 'up -d' doesn't
          # start services in non-default profiles.
          docker compose --profile incident-tracker up -d --no-deps incident-tracker
          # mesh-relay depends on meshmonitor_default (external network) and
          # /dev/ttyACM0 (USB serial) — both may be absent. Non-fatal.
          docker compose --profile mesh-relay up -d --no-deps mesh-relay || echo "::warning::mesh-relay failed to start (expected if meshmonitor stack or serial device is unavailable)"

      - name: Restart FTS when its patches changed
        working-directory: /mnt/user/appdata/tak-server
        run: |
          # The patches are bind-mounted Python modules: a rewritten file is only
          # loaded by a fresh process. Compose does not recreate the container for
          # a changed mount *content*, so restart it when a patch changed.
          if git diff --name-only HEAD~1 HEAD -- server/fts-patches/ 2>/dev/null | grep -q .; then
            echo "fts-patches changed -> restarting freetakserver"
            docker compose restart freetakserver
          else
            echo "fts-patches unchanged"
          fi

      - name: Deploy MDM stack
        working-directory: /mnt/user/appdata/tak-server/mdm
        run: |
          # MDM is a separate compose project from the main tak-server stack.
          # hmdm-db has a healthcheck and hmdm depends_on: service_healthy,
          # so docker compose serializes startup correctly even on cold boot.
          if [ ! -f .env ]; then
            echo "::warning::mdm/.env missing — skipping HMDM deploy. Copy .env.example and fill in values to enable."
            exit 0
          fi
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Wait for Node-RED to start
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$NODERED_URL/tak-map" > /dev/null 2>&1; then
              echo "Node-RED ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Node-RED not responding after 60s"
          exit 1

      - name: Deploy flows to Node-RED
        run: |
          # Node-RED reads flows from its /data volume, not the rsync'd repo copy.
          # Push repo flows via the admin API so they take effect immediately.

          # Authenticate if Node-RED has adminAuth enabled (NR_ADMIN_PASS set in .env)
          CURL_ARGS=()
          NR_ADMIN_PASS=$(grep '^NR_ADMIN_PASS=' "$DEPLOY_DIR/.env" 2>/dev/null | cut -d= -f2- | tr -d "'" | tr -d '"' || true)
          if [[ -n "$NR_ADMIN_PASS" ]]; then
            TOKEN=$(curl -sf -X POST "$NODERED_URL/auth/token" \
              -H 'Content-Type: application/json' \
              -d "{\"client_id\":\"node-red-admin\",\"grant_type\":\"password\",\"scope\":\"*\",\"username\":\"admin\",\"password\":\"$NR_ADMIN_PASS\"}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['access_token'])")
            CURL_ARGS+=(-H "Authorization: Bearer $TOKEN")
            echo "Authenticated with Node-RED admin API"
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$NODERED_URL/flows" \
            -H 'Content-Type: application/json' \
            -H 'Node-RED-Deployment-Type: full' \
            "${CURL_ARGS[@]}" \
            -d @"$DEPLOY_DIR/nodered/flows.json")
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Flows deployed successfully"
          else
            echo "::error::Flow deploy returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Restart Node-RED to load module changes
        working-directory: /mnt/user/appdata/tak-server
        run: |
          # Container restart needed for settings.js and cot-maps.js changes
          # (functionGlobalContext is only read at startup)
          docker compose restart nodered

      - name: Verify core services running
        working-directory: /mnt/user/appdata/tak-server
        run: |
          sleep 10
          docker compose ps --format json | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          services = [json.loads(line) for line in raw.splitlines() if line.strip()]
          # Profile services (incident-tracker) may crash-loop if not configured
          # Only fail on core services
          profile_services = {'incident-tracker', 'mesh-relay', 'github-runner'}
          failed = []
          warned = []
          for s in services:
              if 'running' not in s.get('State', ''):
                  if s['Name'] in profile_services:
                      warned.append(s['Name'])
                  else:
                      failed.append(s['Name'])
          if warned:
              print(f'::warning::Optional services not running: {warned}')
          if failed:
              print(f'FAILED services: {failed}')
              sys.exit(1)
          print(f'All {len(services) - len(warned)} core services running')
          "

      - name: Verify HMDM webapp landing page
        run: |
          # Container-up checks don't catch the failure mode where Tomcat
          # is Running but the HMDM webapp failed to deploy (Liquibase init
          # crashed → ROOT context failed → every path returns a 683-byte
          # 404 stub). The real landing page is ~6500 bytes of AngularJS
          # bootstrap HTML, so assert size > 1KB to distinguish.
          if [ ! -f "$DEPLOY_DIR/mdm/.env" ]; then
            echo "MDM not configured — skipping HMDM health check"
            exit 0
          fi
          # Poll with backoff: HMDM Tomcat + webapp deploy takes ~5s on a
          # healthy boot but can spike to 30s under load.
          for i in $(seq 1 30); do
            SIZE=$(curl -sk -o /dev/null -w '%{size_download}' --max-time 5 "$HMDM_URL/" 2>/dev/null || echo 0)
            if [ "${SIZE:-0}" -ge 1000 ]; then
              echo "HMDM webapp healthy (landing page ${SIZE} bytes, ready after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::HMDM webapp returned ${SIZE} bytes (expected >=1000). Tomcat may be up but webapp failed to deploy — check 'docker logs hmdm' for Liquibase/DB errors."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed on Unraid. Check docker compose logs on the server."
