# Mosquitto ACL — CrypTAK mesh
# meshtastic user: read/write to mesh topics only
user meshtastic
topic readwrite msh/#

# nodered user: WebMap mesh panel (Node-RED mqtt_mesh) — read-only.
# With an acl_file loaded, users without a rule are denied everything;
# this entry was missing from 2026-03-29 to 2026-09-30 and the panel
# silently received nothing (read filtering is not logged).
user nodered
topic read msh/#
